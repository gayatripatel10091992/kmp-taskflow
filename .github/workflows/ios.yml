name: iOS

# Runs the shared Kotlin tests on the iOS simulator. Kept separate from CI because
# macOS runners are not always available; start it manually from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  ios:
    name: Shared tests on iOS simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared tests on iOS simulator + link framework
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
